[package]
name = "zkmetal"
version = "0.1.0"
edition = "2021"
description = "Safe Rust wrappers for Metal-accelerated ZK cryptographic primitives on Apple Silicon"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Carbearnara/zkMetal"
categories = ["cryptography"]
keywords = ["zk", "metal", "apple-silicon", "cryptography", "neon"]

[dependencies]
zkmetal-sys = { path = "../zkmetal-sys", features = ["gpu", "neon"] }

[features]
default = []
# Enable GPU acceleration (Metal GPU NTT, MSM, Poseidon2, Keccak, FRI, Pairing).
gpu = ["zkmetal-sys/gpu"]
# Enable CPU acceleration (ARM NEON NTT, field arithmetic, MSM for many curves).
neon = ["zkmetal-sys/neon"]
