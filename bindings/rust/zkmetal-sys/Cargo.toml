[package]
name = "zkmetal-sys"
version = "0.1.0"
edition = "2021"
description = "Raw FFI bindings to NeonFieldOps and zkMetal GPU engine"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Carbearnara/zkMetal"
categories = ["cryptography", "external-ffi-bindings"]
keywords = ["zk", "metal", "apple-silicon", "cryptography", "neon"]

[build-dependencies]
cc = "1"

[features]
default = []
# Link against the zkMetal C library (zkMetal-ffi) for GPU engine API (MSM, NTT, Poseidon2, Keccak, FRI, Pairing).
gpu = []
# Link against NeonFieldOps for CPU-accelerated field arithmetic and NTT.
neon = []
